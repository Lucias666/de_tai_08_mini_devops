name: Mini DevOps CI Pipeline

# Tự động kích hoạt khi push code hoặc tạo Pull Request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn từ kho lưu trữ về máy ảo của GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Tạo file .env từ file mẫu .env.example để Docker Compose có biến môi trường chạy
      - name: Setup .env file
        run: cp .env.example .env

      # 3. Build và khởi chạy hệ thống Docker Compose
      - name: Build and Start Containers
        run: docker compose up --build -d

      # 4. Chờ Database Healthcheck hoàn tất và kiểm tra kết nối qua cổng 80 (Nginx)
      - name: Wait and Test Application Endpoint
        run: |
          echo "Đang chờ các container khởi động hoàn tất..."
          sleep 15
          docker compose ps
          # Gọi thử vào cổng 80 của Nginx và kiểm tra kết quả trả về
          response=$(curl -s http://localhost:80)
          echo "Phản hồi từ Server: $response"
          echo "$response" | grep "Connected to PostgreSQL successfully!"

      # 5. Dọn dẹp hệ thống sau khi test xong
      - name: Tear down
        if: always()
        run: docker compose down -v
