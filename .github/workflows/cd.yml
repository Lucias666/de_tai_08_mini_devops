name: Deploy to Ubuntu VM (CD)

on:
  workflow_run:
    workflows: ["Mini DevOps CI Pipeline"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-ubuntu-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout commit da qua CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cap nhat va trien khai tren Ubuntu VM
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd /home/lucias/de_tai_8

          # Khong ghi de .env va khong tu y lam mat thay doi local.
          test -f .env || { echo 'Khong tim thay .env tren Ubuntu VM'; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)" || {
            echo 'Co file tracked bi sua tren Ubuntu VM; hay xu ly truoc khi deploy.'
            exit 1
          }

          # Lay dung commit da qua CI tu thu muc checkout (khong can PAT tren VM).
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$DEPLOY_SHA"
          git fetch "$GITHUB_WORKSPACE" HEAD
          git merge --ff-only FETCH_HEAD

          docker compose config -q
          docker compose up -d --build
          docker compose restart nginx
          docker compose ps

          # Smoke test: kiem tra qua Nginx va ket noi PostgreSQL.
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1/ \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["database_status"] == "Connected"'; then
              echo 'CD deployment OK: application is connected to PostgreSQL'
              exit 0
            fi
            sleep 2
          done
          echo 'CD deployment failed: health verification did not pass'
          exit 1
